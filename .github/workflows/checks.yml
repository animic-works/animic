name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect workflow and dependency changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          workflows=false
          dependencies=false
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            workflows=true
            dependencies=true
          else
            changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            while IFS= read -r file; do
              case "$file" in
                .github/workflows/*.yml|.github/workflows/*.yaml) workflows=true ;;
                package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc|patches/*) dependencies=true ;;
              esac
            done <<< "$changed_files"
          fi
          printf 'workflows=%s\ndependencies=%s\n' "$workflows" "$dependencies" >> "$GITHUB_OUTPUT"
      - name: Validate GitHub Actions workflows
        if: steps.changes.outputs.workflows == 'true'
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: "0.3.3"
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Audit dependencies
        if: steps.changes.outputs.dependencies == 'true'
        timeout-minutes: 2
        run: vp pm audit -- --audit-level high
      - name: Generate Workers types
        run: vp run typegen
      - name: Test game rules
        run: vp run test
      - name: Install test browser
        run: vp exec playwright install --with-deps --no-shell chromium
      - name: Build and test production preview
        id: e2e
        run: vp run test:e2e
      - name: Upload E2E failure traces
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Verify generated routes
        run: git diff --exit-code -- src/routeTree.gen.ts
      - name: Format, lint, types and unused code
        run: vp run check
