name: Commit policy
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
concurrency:
  group: commit-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  commit-policy:
    name: Commit policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - name: Validate branch policy
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$BASE_BRANCH" == main ]]; then
            [[ "$HEAD_BRANCH" == develop && "$HEAD_REPO" == "$BASE_REPO" ]] || {
              echo 'mainへのPRは同じリポジトリのdevelopから作成してください。' >&2
              exit 1
            }
          elif [[ "$BASE_BRANCH" == develop ]]; then
            [[ "$HEAD_BRANCH" =~ ^(feat|fix|refactor|perf|docs|test|build|ci|style|revert|chore)/([1-9][0-9]*-)?[a-z][a-z0-9]*(-[a-z0-9]+)*$ ]] || {
              echo 'トピックブランチ名はtype/Issue番号-kebab-case形式にしてください。エージェント名のプレフィックスは禁止です。' >&2
              exit 1
            }
          else
            echo 'PRのマージ先はdevelopまたはmainにしてください。' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: "0.3.3"
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | vp exec commitlint
      - name: Validate commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: vp exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
