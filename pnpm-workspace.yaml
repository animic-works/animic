packages:
  - packages/*
# Vite+と同梱Viteの解決先を一致させる。
overrides:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  # GHSA-67mh-4wv8-2f99対策。依存元が修正済みesbuildへ更新されたら削除する。
  "@esbuild-kit/core-utils@3.3.2>esbuild": "0.25.12"
  # GHSA-wq5f-xc86-pv6w対策。依存元が修正済みsharpへ更新されたら削除する。
  "miniflare@5.20261001.0-alpha>sharp": "0.35.5"
  # GHSA-6qxp-vccf-f47h対策。Ark UI MCPが修正済みSDKへ更新されたら削除する。
  "@ark-ui/mcp@1.3.0>@modelcontextprotocol/sdk": "1.31.0"
# 同梱Vite 8.3.0の代わりに別名パッケージの0.3.3がpeer判定されるため、
# この確認済みバージョンだけを許可する。更新時は同梱版との互換性を再確認する。
peerDependencyRules:
  allowedVersions:
    vite: "0.3.3"
    # StorybookのVite+検出とブラウザビルドをこの組み合わせで検証する。
    "storybook@10.6.1>vite-plus": "0.3.3"
# ローカルWorkers実行に必要なネイティブバイナリの準備だけを許可する。
onlyBuiltDependencies:
  - esbuild
  - workerd
