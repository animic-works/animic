packages:
  - packages/*
# Vite+と同梱Viteの解決先を一致させる。
overrides:
  # GHSA-rxp7-6hxx-x8q5対策。依存元が修正版へ更新されたら削除する。
  "express-rate-limit@8.7.1>ip-address": "10.7.4"
  "vite@*": "catalog:"
  # GHSA-67mh-4wv8-2f99対策。依存元が修正済みesbuildへ更新されたら削除する。
  "@esbuild-kit/core-utils@3.3.2>esbuild": "0.25.12"
  # GHSA-wq5f-xc86-pv6w対策。依存元が修正済みsharpへ更新されたら削除する。
  "miniflare@5.20261001.0-alpha>sharp": "0.35.5"
  # GHSA-22jm-h49p-29qw・GHSA-46jr-4wx8-v453対策。Ark UI MCPが修正済みSDKへ更新されたら削除する。
  "@ark-ui/mcp@1.3.0>@modelcontextprotocol/sdk": "1.32.1"
# 同梱Vite 8.3.4の代わりに別名パッケージの1.3.0がpeer判定されるため、
# この確認済みバージョンだけを許可する。更新時は同梱版との互換性を再確認する。
peerDependencyRules:
  allowedVersions:
    vite: "1.3.0"
    # StorybookのVite+検出とブラウザビルドをこの組み合わせで検証する。
    "storybook@10.6.3>vite-plus": "1.3.0"
# ローカルWorkers実行に必要なネイティブバイナリの準備だけを許可する。
onlyBuiltDependencies:
  - esbuild
  - workerd
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
